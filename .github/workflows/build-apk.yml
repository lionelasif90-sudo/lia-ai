name: Build Lia AI
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Unit tests (both flavors)
        run: gradle testDirectDebugUnitTest testPlayDebugUnitTest --stacktrace
      - name: Build debug APKs
        run: gradle assembleDirectDebug assemblePlayDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lia-ai-debug-apks
          path: |
            app/build/outputs/apk/direct/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/**
